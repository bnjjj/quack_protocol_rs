name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  QUACK_SERVER_URI: quack:127.0.0.1:9495
  QUACK_AUTH_TOKEN: super_secret

jobs:
  test:
    name: clippy, tests, and live Quack integration (DuckDB ${{ matrix.duckdb }})
    runs-on: ubuntu-latest
    # One pinned server per Quack protocol version the client supports, so a
    # new DuckDB release cannot change the server under test.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each server runs the shared live tests and its own version's
          # (`live_v1_*` or `live_v3_*`), and skips the other version's.
          - duckdb: v1.5.6
            cli: duckdb_cli-linux-amd64.zip
            quack_version: 1
            skip: live_v3_
          - duckdb: v2.0.0
            cli: duckdb-cli-linux-amd64.tar.gz
            quack_version: 3
            skip: live_v1_
    env:
      QUACK_EXPECTED_VERSION: ${{ matrix.quack_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install DuckDB CLI
        env:
          DUCKDB_URL: https://github.com/duckdb/duckdb/releases/download/${{ matrix.duckdb }}/${{ matrix.cli }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duckdb"
          curl -fsSL "$DUCKDB_URL" -o "$RUNNER_TEMP/${{ matrix.cli }}"
          # DuckDB 2.0 ships the CLI as a .tar.gz; earlier releases ship a .zip.
          case "${{ matrix.cli }}" in
            *.zip) unzip -q "$RUNNER_TEMP/${{ matrix.cli }}" -d "$RUNNER_TEMP/duckdb" ;;
            *.tar.gz) tar -xzf "$RUNNER_TEMP/${{ matrix.cli }}" -C "$RUNNER_TEMP/duckdb" ;;
          esac
          chmod +x "$RUNNER_TEMP/duckdb/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"

      - name: Start local Quack server
        run: |
          set -euo pipefail
          startup_sql="INSTALL quack; LOAD quack; CALL quack_serve('${QUACK_SERVER_URI}', token = '${QUACK_AUTH_TOKEN}');"
          tail -f /dev/null | duckdb -init /dev/null -cmd "$startup_sql" > "$RUNNER_TEMP/quack-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/quack-server.pid"
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:9495/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/quack-server.log"
          exit 1

      - name: Run tests
        run: cargo test --locked --all-targets --all-features -- --skip "${{ matrix.skip }}"

      - name: Stop local Quack server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/quack-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/quack-server.pid")" || true
          fi

      - name: Upload Quack server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quack-server-log-${{ matrix.duckdb }}
          path: ${{ runner.temp }}/quack-server.log
          if-no-files-found: ignore
