[package]
name = "quack_protocol"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Rust client SDK for DuckDB's experimental Quack remote protocol"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/quack_protocol"
keywords = ["duckdb", "quack", "database", "client"]
categories = ["api-bindings", "database"]

[features]
arrow = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-buffer"]
# Public message types and the response encoders a Quack server needs.
server = []

[dependencies]
arrow-array = { version = "58", optional = true, default-features = false }
arrow-buffer = { version = "58", optional = true, default-features = false }
arrow-schema = { version = "58", optional = true, default-features = false }
async-stream = "0.3"
base64 = "0.22"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
hex = "0.4"
indexmap = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
ring = "0.17"
# Must stay on the rustls line reqwest uses: `use_preconfigured_tls` only
# accepts a `ClientConfig` from that version.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1"
url = "2"
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
